name: Reusable ACR Terraform Plan

on:
  workflow_call:
    inputs:
      change_request_id: { type: string, required: true }
      dso: { type: string, required: true }
      subscription_id: { type: string, required: true }
      resource_group_name: { type: string, required: true }
      acr_name: { type: string, required: true }
      location: { type: string, required: true }
      sku: { type: string, required: true }
      public_network_access: { type: string, required: true }
      private_endpoint_required: { type: string, required: true }
      issue_number: { type: string, required: true }

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DSO: ${{ inputs.dso }}
          ACR_NAME: ${{ inputs.acr_name }}
          SKU: ${{ inputs.sku }}
          PUBLIC_NETWORK_ACCESS: ${{ inputs.public_network_access }}
          PRIVATE_ENDPOINT_REQUIRED: ${{ inputs.private_endpoint_required }}
        run: |
          set -euo pipefail
          [[ "$CHANGE_REQUEST_ID" =~ ^RITM[0-9]{7,}$ ]] || { echo "Invalid RITM format"; exit 1; }
          [[ "$ACR_NAME" =~ ^[a-zA-Z0-9]{5,50}$ ]] || { echo "Invalid ACR name"; exit 1; }
          case "$DSO" in WIPRO|FAAST|CTS|TCS|DXC) ;; *) echo "Invalid DSO"; exit 1 ;; esac
          case "$SKU" in Premium|Standard|Basic) ;; *) echo "Invalid SKU"; exit 1 ;; esac
          case "$PUBLIC_NETWORK_ACCESS" in Enabled|Disabled) ;; *) echo "Invalid public access value"; exit 1 ;; esac
          case "$PRIVATE_ENDPOINT_REQUIRED" in Yes|No) ;; *) echo "Invalid private endpoint value"; exit 1 ;; esac
          if [[ "$PRIVATE_ENDPOINT_REQUIRED" == "Yes" && "$SKU" != "Premium" ]]; then
            echo "Private endpoint requires Premium SKU."
            exit 1
          fi

  terraform-plan:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow checks out the CALLER repo by default.
      # The ACR module lives in the Golden Repo, so check it out explicitly.
      - name: Checkout Golden Repository
        uses: actions/checkout@v4
        with:
          repository: satishg25/alz-goldenrepo-lab
          ref: main
          # If the Golden Repo is private, uncomment the next line and add the
          # secret in the Landing Repo. The caller already uses `secrets: inherit`.
          # token: ${{ secrets.GOLDEN_REPO_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Generate terraform.tfvars.json
        env:
          CHANGE_REQUEST_ID: ${{ inputs.change_request_id }}
          DSO: ${{ inputs.dso }}
          SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          RESOURCE_GROUP_NAME: ${{ inputs.resource_group_name }}
          ACR_NAME: ${{ inputs.acr_name }}
          LOCATION: ${{ inputs.location }}
          SKU: ${{ inputs.sku }}
          PUBLIC_NETWORK_ACCESS: ${{ inputs.public_network_access }}
          PRIVATE_ENDPOINT_REQUIRED: ${{ inputs.private_endpoint_required }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          values = {
              "change_request_id": os.environ["CHANGE_REQUEST_ID"],
              "dso": os.environ["DSO"],
              "subscription_id": os.environ["SUBSCRIPTION_ID"],
              "resource_group_name": os.environ["RESOURCE_GROUP_NAME"],
              "acr_name": os.environ["ACR_NAME"],
              "location": os.environ["LOCATION"],
              "sku": os.environ["SKU"],
              "public_network_access_enabled": os.environ["PUBLIC_NETWORK_ACCESS"] == "Enabled",
              "private_endpoint_enabled": os.environ["PRIVATE_ENDPOINT_REQUIRED"] == "Yes",
          }
          with open("terraform.tfvars.json", "w", encoding="utf-8") as f:
              json.dump(values, f, indent=2)
          PY
          echo "Generated terraform.tfvars.json:"
          cat terraform.tfvars.json

      - name: Terraform format check
        working-directory: modules/acr
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: modules/acr
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: modules/acr
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: modules/acr
        env:
          ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color \
            -var-file=../../terraform.tfvars.json \
            -out=tfplan | tee plan.txt

      # Runs at the repo root, not modules/acr, so it still works if plan fails.
      - name: Add plan summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ACR Terraform Plan"
            echo "- Issue: #${{ inputs.issue_number }}"
            echo "- Change request: ${{ inputs.change_request_id }}"
            echo "- ACR: ${{ inputs.acr_name }}"
            echo "- Resource group: ${{ inputs.resource_group_name }}"
            echo "- Location: ${{ inputs.location }}"
            echo "- SKU: ${{ inputs.sku }}"
            echo "- Public network access: ${{ inputs.public_network_access }}"
            echo "- Private endpoint requested: ${{ inputs.private_endpoint_required }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acr-plan-${{ inputs.change_request_id }}-${{ github.run_id }}
          path: |
            modules/acr/tfplan
            modules/acr/plan.txt
            terraform.tfvars.json
          if-no-files-found: warn
          retention-days: 7
